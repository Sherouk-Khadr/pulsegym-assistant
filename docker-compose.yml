services:
  assistant:
    build: .
    ports:
      - "8080:8080"
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}   # gemini | groq | openai | ollama
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
